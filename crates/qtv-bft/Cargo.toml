[package]
name = "qtv-bft"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "qtv_bft"

[features]
# Deterministic, per id validator constructors for the test suite and the local
# devnet simulation. Off by default, so a node binary never carries an id derived
# key path. Enabled for this crate's own tests through the dev-dependency below.
test-fixtures = []

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4d73a36c112b91a6a25a6a876f54cdccb729c7de" }

[dev-dependencies]
qtv-bft = { path = ".", features = ["test-fixtures"] }
