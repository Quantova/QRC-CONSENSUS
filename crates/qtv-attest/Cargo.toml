[package]
name = "qtv-attest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "qtv_attest"

[features]
test-fixtures = ["qtv-sampler/test-fixtures", "qtv-bft/test-fixtures"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }
qtv-bft = { path = "../qtv-bft" }
qtv-sampler = { path = "../qtv-sampler" }

[dev-dependencies]
qtv-attest = { path = ".", features = ["test-fixtures"] }
