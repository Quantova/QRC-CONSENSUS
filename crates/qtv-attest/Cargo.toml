[package]
name = "qtv-attest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "qtv_attest"

[features]
# Deterministic, per id attester constructors for the test suite and the local
# devnet simulation. Off by default, so a node binary never carries an id derived
# key path. Propagates to the sampler and bft fixtures the attester composes.
test-fixtures = ["qtv-sampler/test-fixtures", "qtv-bft/test-fixtures"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "21e28f1ffd1ca46a7144136c483618b18cd29bae" }
qtv-bft = { path = "../qtv-bft" }
qtv-sampler = { path = "../qtv-sampler" }

[dev-dependencies]
qtv-attest = { path = ".", features = ["test-fixtures"] }
