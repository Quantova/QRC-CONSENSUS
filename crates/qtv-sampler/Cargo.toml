[package]
name = "qtv-sampler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "qtv_sampler"

[features]
# Deterministic, per id validator constructors for the test suite and the local
# devnet simulation. Off by default, so a node binary never carries an id derived
# key path. Enabled for this crate's own tests through the dev-dependency below.
test-fixtures = []

[dependencies]
q-vrf = { path = "../q-vrf" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "33c7e9395ad23f07019909470d319211213e904f" }

[dev-dependencies]
qtv-sampler = { path = ".", features = ["test-fixtures"] }
