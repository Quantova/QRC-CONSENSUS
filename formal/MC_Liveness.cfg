\* Finite liveness configuration for the QORUS core.
\* Four honest validators, one offline and tolerated, quorum is three. After
\* the network stabilizes every pending height eventually finalizes. Two
\* heights show the chain growing in order.
SPECIFICATION Spec

CONSTANTS
    N = 4
    Byzantine = {}
    Offline = {4}
    Provers = {pr1}
    Vals = {a, b}
    Genesis = gen
    ResourceBound = 1
    MaxHeight = 2
    MaxView = 3

INVARIANTS
    TypeOK
    Agreement
    ValidFinalized
    ChainDescends
    OnlyByzantineSlashed
    OfflineNeverSlashed
    ProversHaveNoVote

PROPERTY
    Liveness
