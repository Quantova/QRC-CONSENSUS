\* Finite safety configuration for the QORUS core.
\* Four validators, one byzantine, quorum is three. The byzantine validator
\* leads an early view and may equivocate both its proposal and its
\* attestations. One height gives the strong single decision adversary. The
\* two height chain is exercised by the liveness configuration.
SPECIFICATION SafeSpec

CONSTANTS
    N = 4
    Byzantine = {2}
    Offline = {}
    Provers = {pr1}
    Vals = {a, b}
    Genesis = gen
    ResourceBound = 1
    MaxHeight = 1
    MaxView = 1

INVARIANTS
    TypeOK
    Agreement
    ValidFinalized
    ChainDescends
    OnlyByzantineSlashed
    OfflineNeverSlashed
    ProversHaveNoVote
